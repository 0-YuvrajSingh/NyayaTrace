server.port=8080
# Base URL of the Python ML service (compose service name or loopback).
ml.base-url=${ML_BASE_URL:http://127.0.0.1:8001}
# Local-demo bearer token. Empty means every protected endpoint rejects
# (fail-closed). Set DEMO_API_TOKEN in the environment; never commit it.
demo.api-token=${DEMO_API_TOKEN:}
# Internal caller token sent from Spring to the ML service (same rule).
ml.internal-token=${ML_INTERNAL_TOKEN:}
spring.jackson.serialization.indent_output=false
